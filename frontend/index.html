<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>海星學生會匿名板</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="greeting-header">
      <h1>海星中學官方匿名板</h1>
      <h2 id="dynamic-greeting">早安</h2>
      <p class="subtitle">今天想分享什麼？匿名發布，安心傾訴</p>
    </header>

    <main class="container">
      <section class="post-form-container">
        <form id="post-form" class="pill-form">
          <input 
            type="text" 
            id="post-content" 
            placeholder="說點什麼吧..." 
            maxlength="500" 
            required 
            autocomplete="off"
          />
          <button type="submit" id="submit-post-btn" class="send-btn" title="發布">
            <span class="send-text">送出</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </section>

      <section id="posts-container" class="posts-container">
        <!-- Posts will be rendered here -->
      </section>
      
      <div id="loading-spinner" class="loading-spinner hidden">
        <div class="spinner"></div>
      </div>
    </main>

    <!-- Floating Action Buttons (Bottom Left) -->
    <div class="fab-container">
      <a href="#" target="_blank" class="fab-btn line-btn" title="加入 Line 群組" id="line-link">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
          <path d="M22.5 10.6c0-4.6-4.7-8.3-10.5-8.3S1.5 6 1.5 10.6c0 4.1 3.7 7.6 8.7 8.2.4.1.9.3 1 .7.1.3.1.8 0 1.2 0 0-.1.8-.2 1-.1.3-.3.4.7-.1 1-.5 5.5-3.3 7.5-5.5 1.5-1.5 1.8-3.3 1.8-5.5zm-14.7 3c0 .2-.2.4-.4.4h-2.3c-.2 0-.4-.2-.4-.4V7.5c0-.2.2-.4.4-.4h.9c.2 0 .4.2.4.4v4.7h1.4c.2 0 .4.2.4.4v.9zm2.4 0c0 .2-.2.4-.4.4h-.9c-.2 0-.4-.2-.4-.4V7.5c0-.2.2-.4.4-.4h.9c.2 0 .4.2.4.4v6.1zm5.2 0c0 .2-.2.4-.4.4h-.9c-.2 0-.4-.2-.4-.4v-3.7l-1.9 4c-.1.1-.2.2-.3.2h-.9c-.2 0-.4-.2-.4-.4V7.5c0-.2.2-.4.4-.4h.9c.2 0 .4.2.4.4v3.7l1.9-4c.1-.1.2-.2.3-.2h.9c.2 0 .4.2.4.4v6.1zm2.3-4.7c0 .2-.2.4-.4.4h-1.4v1.2h1.4c.2 0 .4.2.4.4v.9c0 .2-.2.4-.4.4h-2.3c-.2 0-.4-.2-.4-.4V7.5c0-.2.2-.4.4-.4h2.3c.2 0 .4.2.4.4v.9c0 .2-.2.4-.4.4h-1.4v1.1h1.4c.2 0 .4.2.4.4v.9z"/>
        </svg>
      </a>
      <a href="#" target="_blank" class="fab-btn ig-btn" title="追蹤 Instagram" id="ig-link">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
        </svg>
      </a>
    </div>

    <!-- Report Modal -->
    <div id="report-modal" class="modal hidden">
      <div class="modal-content">
        <h3>檢舉內容</h3>
        <p class="modal-desc">請描述檢舉原因，我們會盡快處理。</p>
        <textarea id="report-reason" placeholder="請輸入檢舉原因..." rows="4"></textarea>
        <div class="modal-actions">
          <button id="cancel-report-btn" class="btn-secondary">取消</button>
          <button id="submit-report-btn" class="btn-danger">提交檢舉</button>
        </div>
      </div>
    </div>

    <!-- Toast Notifications Area -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
